version: 2

models:
  - name: fact_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: campaign_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_key
      - name: revenue
        tests:
          - not_null

  - name: dim_customer
    columns:
      - name: customer_key
        tests:
          - not_null
          - unique

  - name: dim_product
    columns:
      - name: product_key
        tests:
          - not_null
          - unique

  - name: dim_campaign
    columns:
      - name: campaign_key
        tests:
          - not_null
          - unique

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
